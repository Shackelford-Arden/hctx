name: run-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Batch changes
        run: changie batch auto

      - name: Merge changes
        run: changie merge

      - name: Get the latest version
        id: latest
        run: echo "output=$(changie latest)" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git tag "${{ steps.latest.outputs.output }}"
          git push origin "${{ steps.latest.outputs.output }}"

      - name: Run GoReleaser
        run: goreleaser release --clean --release-notes=".changes/${{ steps.latest.outputs.output }}.md" --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: "${{ steps.latest.outputs.output }}"

      # Commit and push the updated CHANGELOG.md
      - name: Commit CHANGELOG
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git pull
          git add CHANGELOG.md
          git add .changes/
          git commit -m "Update CHANGELOG.md for ${{ steps.latest.outputs.output }} [skip ci]" || echo "No changes to commit"
          git push origin main